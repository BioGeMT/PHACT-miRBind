configfile: "config/config.yaml"
workdir: "../workflow_WGA"
query_ids_file: "hs_mirna.txt"
score_result_dirname: "result_WGA"

# WGA data
msa_file_pattern: "../UCSC_alignments_premirna/alignments/{query_id}_pre_aln.fasta"
tree_file_path: "../UCSC_alignments_premirna/tree_470way_unrooted.nwk"

# IQ-TREE
iqtree_ancestral_model: "scripts/notr_model.txt"
iqtree_seed: "777"

#SCORE CALCULATION
weights: "0.1,0.5,0,1,2,3,5,mean,median,X,CountNodes_1,CountNodes_2,CountNodes_3,CountNodes_4,0_MinNode_Mix,0_MinNode_Mix2"
pattern: ["CountNodes_3"]
