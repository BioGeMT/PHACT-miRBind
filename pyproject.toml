[project]
name = "phact-mirbind"
version = "0.1.0"
description = "PHACT-augmented miRNA binding models and score-cache utilities"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scikit-learn>=1.4",
    "torch>=2.2",
]

[project.scripts]
prepare-cv-folds = "phact_mirbind.cli.prepare_cv:main"
build-cv-cache = "phact_mirbind.cli.build_cv_cache:main"
train-cv-mirbind = "phact_mirbind.cli.train_cv:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
